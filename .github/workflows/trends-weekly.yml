name: Trends weekly (Instagram via Apify)
on:
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trends-weekly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GRAILED_ALGOLIA_APP_ID: ${{ secrets.GRAILED_ALGOLIA_APP_ID }}
      GRAILED_ALGOLIA_KEY: ${{ secrets.GRAILED_ALGOLIA_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      GR_MODEL_DIR: models
      MAX_LLM_ITEMS_PER_DAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pull latest posts from the curated account list
        run: python -m scrapers.run trends
      - name: Compute weekly trend scores
        run: python -m pipeline.run trends
      - name: Rescore active listings
        run: python -m pipeline.run rescore
