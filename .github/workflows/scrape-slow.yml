name: Scrape slow (Japan, webshops)
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrape-slow
  cancel-in-progress: false
jobs:
  configured:
    # Until the database (and, for deploys, Cloudflare) secrets exist, do nothing quietly instead of
    # scraping marketplaces into a throwaway database or failing every run.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          NEEDED: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          if [ -n "$NEEDED" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Required secrets are not set yet, so this run is skipped. See docs/SETUP.md."
          fi
  run:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GRAILED_ALGOLIA_APP_ID: ${{ secrets.GRAILED_ALGOLIA_APP_ID }}
      GRAILED_ALGOLIA_KEY: ${{ secrets.GRAILED_ALGOLIA_KEY }}
      SITE_URL: ${{ vars.SITE_URL || 'https://grail-radar.grail-radar-worker.workers.dev' }}
      GR_MODEL_DIR: models
      MAX_LLM_ITEMS_PER_DAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Scrape
        run: python -m scrapers.run slow
      - name: Recheck tracked listings
        run: python -m scrapers.run recheck
      - name: Score new listings
        run: python -m pipeline.run score
      - name: Keep raw responses for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw/
          retention-days: 7
          if-no-files-found: ignore
