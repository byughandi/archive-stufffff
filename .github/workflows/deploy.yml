name: Deploy
on:
  push:
    branches: [main]
    paths: ["worker/**", "web/**", "db/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  configured:
    # Until the database (and, for deploys, Cloudflare) secrets exist, do nothing quietly instead of
    # scraping marketplaces into a throwaway database or failing every run.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          NEEDED: ${{ secrets.TURSO_DATABASE_URL && secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$NEEDED" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Required secrets are not set yet, so this run is skipped. See docs/SETUP.md."
          fi
  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          extras: "dev"
      - name: Apply database schema (idempotent)
        run: python -c "from core.db import connect; db = connect(); db.migrate(); print('schema ok')"
      - name: Sync taxonomy names for the site's filter menus
        run: python -m pipeline.run taxonomy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build site into worker/public
        run: npm ci && npm run build
        working-directory: web
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Push database credentials to the Worker as secrets
        working-directory: worker
        run: |
          jq -n --arg u "$TURSO_DATABASE_URL" --arg t "$TURSO_AUTH_TOKEN" \
            '{TURSO_DATABASE_URL: $u, TURSO_AUTH_TOKEN: $t}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Deploy Worker and site
        working-directory: worker
        # The Access team domain and audience tag are identifiers, not secrets: they live in
        # worker/wrangler.jsonc so a deploy can never blank them.
        run: npx wrangler deploy
