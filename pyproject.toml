[project]
name = "grail-radar"
version = "0.1.0"
description = "Always-on archive-fashion deal finder"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "rapidfuzz>=3.9",
  "mercapi>=0.4",
  "selectolax>=0.3.21",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4", "pillow>=10", "imagehash>=4.3"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["core*", "scrapers*", "pipeline*"]
