fake_red_flags:
  - id: label_era_mismatch_slp_yves
    description: "Piece claimed as Hedi-era Saint Laurent (2012-2016) but described with 'Yves Saint Laurent' label wording, or claimed pre-2012 but with 'Saint Laurent Paris'. Label wording changed June 2012 (documented for bag stamps and the SS15 jacket label)."
    listing_signals: ["yves saint laurent label hedi", "ysl label slp l01", "saint laurent paris 2009", "saint laurent paris 2010", "label says yves and saint laurent paris"]
    brands: [saint_laurent]
    severity: 2
    sources: ["https://retaildetail.eu/news/food/hedi-slimane-drops-yves-saint-laurent-brand-name", "https://www.palaisgalliera.paris.fr/en/node/2627"]
  - id: label_era_mismatch_celine_accent
    description: "Piece claimed as Hedi-era Celine (2018+) with accented 'CELINE' label wording, or claimed Phoebe-era with unaccented logo. Accent drop happened with Hedi (verify exact date)."
    listing_signals: ["celine hedi céline label", "hedi era with accent", "phoebe era no accent"]
    brands: [celine]
    severity: 2
    sources: ["https://hypebeast.com/2024/10/hedi-slime-exit-celine-michael-rider-appointed-creative-director"]
  - id: label_era_mismatch_dior_homme
    description: "Listing claims Hedi era (2000-2007) but shows 'Dior Men', Oblique monogram, 2018+ product names, or a tag code whose leading digit contradicts the claimed year (e.g. claims SS04 but code starts with 9 or 0). Leading digit repeats every decade, so only use as a flag when the seller also gives a season."
    listing_signals: ["hedi slimane oblique", "dior men hedi", "dior homme ss04 code 9", "dior homme hedi 2019", "dior homme hedi bee embroidery"]
    brands: [dior_homme]
    severity: 2
    sources: ["https://suigenerisconsignment.com/pages/dior-homme-reference-codes", "https://suigenerisconsignment.com/pages/designer-authentication-guide/dior"]
  - id: label_era_mismatch_margiela
    description: "Claimed Martin-era (pre-2009) piece with 'Maison Margiela' (no Martin) label wording or post-2014 Galliano-era product names (Glam Slam, 5AC). Wording-change date is unverified, so use as soft signal."
    listing_signals: ["martin era maison margiela", "maison margiela 2005", "glam slam martin", "margiela 1999 maison margiela label"]
    brands: [margiela]
    severity: 1
    sources: ["https://www.ssense.com/en-ee/editorial/fashion/maison-margiela-guide"]
  - id: label_era_mismatch_number_nine
    description: "Claimed Miyashita-era (1997-2009) Number (N)ine but label/text mentions 'by Takahiro Miyashita' relaunch wording, 'new arrivals', or 2025+ release names; or tee blank is a generic Gildan/Anvil/Fruit-of-the-Loom body."
    listing_signals: ["number nine by takahiro miyashita aw05", "number nine new arrivals archive", "number nine gildan", "number nine anvil tag", "number nine hanes tag"]
    brands: [number_nine]
    severity: 3
    sources: ["https://hypebeast.com/ph/2025/9/takahiro-miyashita-announces-numbernine-news-return", "https://www.fashionsnap.com/article/2026-03-12/numbernine-1st-release/"]
  - id: made_in_country_mismatch
    description: "Country of origin inconsistent with brand/era. Hedi Dior Homme denim is documented Italy and Japan; Number (N)ine/Undercover early-era pieces are Japan-made; Chanel RTW 90s is France. 'Made in China/Turkey/Vietnam/Bangladesh' on these is a strong flag."
    listing_signals: ["made in china dior homme", "made in turkey saint laurent", "made in china number nine", "made in china chanel", "made in bangladesh rick owens", "made in vietnam undercover early"]
    brands: [dior_homme, number_nine, chanel, undercover, saint_laurent, rick_owens, balmain, helmut_lang]
    severity: 3
    sources: ["https://philamuseum.org/collection/object/325668", "https://www.heddels.com/?p=5020"]
  - id: pristine_label_on_worn_piece
    description: "Heavily worn/faded/distressed garment with a crisp, unfaded woven label or care tag (or the opposite: new-looking garment, aged label). Needs image analysis; seller text rarely admits it."
    listing_signals: ["label looks new", "tag is crisp", "replaced tag", "new tag sewn", "new label"]
    brands: []
    severity: 2
    sources: ["https://suigenerisconsignment.com/pages/designer-authentication-guide/dior"]
  - id: resewn_or_replaced_label
    description: "Label re-sewn, replaced, or added after the fact; crooked or different thread colour stitching around the label. Margiela's four white stitches are factory-original and loosely stitched by design, so exclude them."
    listing_signals: ["label re-sewn", "tag re-sewn", "new label sewn", "tag replaced", "label replaced", "label added"]
    brands: []
    severity: 3
    sources: ["https://www.ssense.com/en-ee/editorial/fashion/maison-margiela-guide"]
  - id: wrong_font_or_logo_spacing
    description: "Label/print typography off from known examples (kerning, weight, letterforms, CC interlock proportions). Requires image-model comparison against exemplar labels; seller text will not say it."
    listing_signals: ["font looks off", "text looks different", "logo seems different", "spacing looks odd"]
    brands: [chanel, dior_homme, saint_laurent, chrome_hearts, number_nine, rick_owens, erd, supreme, bape]
    severity: 2
    sources: ["https://suigenerisconsignment.com/pages/designer-authentication-guide/dior"]
  - id: stock_or_borrowed_photos
    description: "Listing uses brand-site, retailer, or other sellers' photos; no photo of tags/labels/hardware; or watermarked images from another store."
    listing_signals: ["stock photo", "stock photos", "photos from internet", "pictures from the internet", "image from website", "photo not mine", "similar item photo", "photos for reference only", "actual item may vary"]
    brands: []
    severity: 3
    sources: ["https://www.1stdibs.com/blogs/the-study/how-to-spot-a-fake-ysl-bag"]
  - id: no_tag_or_label_photos
    description: "Seller shows no photo of care tag, label, hardware stamps or reference code; era and authenticity cannot be resolved."
    listing_signals: ["no tag photo", "tags not shown", "tag not pictured", "ask for tag pics", "dm for tag photos", "tag available upon request"]
    brands: []
    severity: 2
    sources: ["https://suigenerisconsignment.com/pages/dior-homme-reference-codes"]
  - id: implausibly_low_price
    description: "Asking price below brand+archetype price_floor_usd (brands.yaml). Compute at scoring time; severity scales with how far under the floor."
    listing_signals: ["price below price_floor_usd"]
    brands: []
    severity: 2
    sources: ["https://www.grailed.com/designers/chrome-hearts"]
  - id: overseas_shipping_origin_and_authenticity_spam
    description: "Ships from Guangzhou/Shenzhen/Hong Kong/Dongguan for a brand whose genuine pieces are rarely there, with boilerplate '100% authentic guaranteed', 'authenticity guaranteed', 'real photos' repeated across many listings. Soft signal; legit Hong Kong/Thailand archive dealers exist (e.g. Bangkok glam dealers)."
    listing_signals: ["ships from china", "ships from guangzhou", "ships from shenzhen", "100% authentic guaranteed", "100% legit", "real photos taken by me", "trusted seller dm"]
    brands: [chanel, chrome_hearts, rick_owens, saint_laurent, dior_homme, balenciaga, supreme, off_white, bape, erd]
    severity: 1
    sources: ["https://www.1stdibs.com/blogs/the-study/how-to-spot-a-fake-ysl-bag"]
  - id: chanel_hardware_and_codes
    description: "Chanel (vintage jewelry/belts/RTW): no collection/date code where one is expected on RTW labels, hardware without CHANEL/PARIS engraving, 'made in China', plated finish flaking on a 'gold' item, or an authenticity card shown as proof (cards are easily forged and absent on 90s costume jewelry). Treat all Chanel as high fake-prevalence; apply a heavy base penalty."
    listing_signals: ["authenticity card included", "made in china chanel", "no date code", "no stamp", "unmarked cc", "plated chanel", "cc logo no engraving"]
    brands: [chanel]
    severity: 3
    sources: ["https://etoile-luxuryvintage.com/blogs/guides-how-tos/guide-to-how-to-read-dior-codes", "https://www.instagram.com/glam_archive/"]
  - id: chanel_high_fake_prevalence
    description: "Base rate: Chanel fakes are rampant in vintage resale (per the user's own note). Default risk uplift for any Chanel listing without clear tag/hardware photos."
    listing_signals: ["chanel"]
    brands: [chanel]
    severity: 2
    sources: ["https://www.instagram.com/glam_archive/"]
  - id: dior_homme_reference_code_absent_or_wrong
    description: "Dior Homme apparel tags normally carry a reference code starting with a year digit (documented example '5EH1015678 E47 B6A8' = SS05). Missing code, or a code format that is only digits/length-off, is a flag. Do not apply the bag date-code or perfume batch-code systems to apparel."
    listing_signals: ["no reference code", "tag has no code", "code not visible", "dior homme tag blurred"]
    brands: [dior_homme]
    severity: 2
    sources: ["https://suigenerisconsignment.com/pages/dior-homme-reference-codes"]
  - id: slp_l01_construction_and_origin
    description: "Saint Laurent L01/biker listings with 'made in China/Turkey', missing style/season tag, 'SLP' printed rather than woven label, or sold as 'L01' with no model code. Low confidence heuristic from general knowledge, not source-verified."
    listing_signals: ["l01 made in china", "slp style jacket", "no style tag", "l01 no tag", "saint laurent printed label"]
    brands: [saint_laurent]
    severity: 2
    sources: ["https://www.1stdibs.com/blogs/the-study/how-to-spot-a-fake-ysl-bag"]
    confidence: low
  - id: chrome_hearts_silver_stamps_and_plating
    description: "Chrome Hearts silver jewelry normally bears CH hallmarks/925 and ©year; unstamped, plated (flaking), or too-light pieces are a flag; leather/denim pieces with plain 'Chrome Hearts' printed tags. Low confidence heuristic."
    listing_signals: ["no stamp", "no 925", "plated", "silver plated", "925 not stamped", "unmarked ch", "chrome hearts pendant brass"]
    brands: [chrome_hearts]
    severity: 3
    sources: ["https://www.grailed.com/designers/chrome-hearts"]
    confidence: low
  - id: rick_owens_season_tag_and_origin
    description: "Rick Owens: 'DRKSHDW' pieces with printed rather than woven brand labels, no season/item code, 'made in China/Bangladesh', or Geobasket listings using retailer stock photos. Low confidence; no verified code pattern exists in this taxonomy."
    listing_signals: ["drkshdw printed label", "no season code", "made in china rick owens", "geobasket stock photo"]
    brands: [rick_owens]
    severity: 2
    sources: ["https://sites.fitnyc.edu/depts/museum/Gothic/Owens.html"]
    confidence: low
  - id: erd_unfinished_distressing_and_price
    description: "ERD pieces are hand-distressed one-offs; listings with machine-uniform distressing, blank Gildan/Hanes bodies, or prices far under floor are suspicious; 'ERD x' collabs claimed without proof. Low confidence heuristic."
    listing_signals: ["erd gildan", "erd blank tee", "erd uniform distress", "erd collab no proof"]
    brands: [erd]
    severity: 2
    sources: ["https://www.mrporter.com/en-au/journal/fashion/enfants-riches-deprimes-erd-25368192"]
    confidence: low
  - id: undercover_jp_tag_and_graphic_mismatch
    description: "Undercover/Beauty:Beast/20471120/Hysteric archive pieces with Western print-on-demand bodies, 'made in china' on an early-era item, or season graphics that do not belong to the claimed season. Low confidence."
    listing_signals: ["undercover gildan", "undercover made in china 2003", "beauty beast gildan", "hysteric glamour gildan"]
    brands: [undercover, beauty_beast, "20471120", hysteric_glamour]
    severity: 2
    sources: ["https://www.grailed.com/drycleanonly/master-class-undercover"]
    confidence: low
  - id: qualityreps_pattern_note
    description: "r/QualityReps-style vocabulary appears in titles: 'batch', 'GOAT quality', 'LJR', 'PK', 'OG batch', 'budget', 'W2C', 'QC photos', 'haul'. Used for AWARENESS ONLY: if present, hard-reject. This taxonomy did not consult that subreddit this session."
    listing_signals: ["batch", "w2c", "qc photos", "pk batch", "ljr", "god batch", "gx batch", "haul", "budget version"]
    brands: []
    severity: 3
    sources: []
    confidence: low
