# R2 blocklist.yaml. All phrases lowercase, matched case-insensitively.
# MATCHING NOTES for the engine (extra keys beyond SCHEMAS.md are optional and safe to ignore):
#   - `match: word` = whole-word match (needed for short tokens like "rep", "ua", "aaa", "copy"); default is substring.
#   - The bare word "style" is NOT rejected (it appears in legit titles: "style no.", "hair style", "styled by", Hedi
#     "SLP style code", "Biker style jacket" etc.). Only the construction patterns below are rejected.
#   - JP: "風" / "タイプ" / "系" mean "-style / type / -esque" and are conditional (see aliases_ja.yaml for signals).
#   - Brand/era words inside negative_context lists in brands.yaml are the preferred way to handle collisions; this
#     file holds cross-brand rules.
reject_phrases:
  - {phrase: "inspired", scope: title, match: word, reason: "'X-inspired' = not the brand. In description alone it can be legit (e.g. 'collection inspired by the Manic Street Preachers'), so title only."}
  - {phrase: "inspired by", scope: any, reason: "Lookalike language; if brand name follows within 3 words, hard reject."}
  - {phrase: "in the style of", scope: any, reason: "Explicit lookalike."}
  - {phrase: "style of", scope: title, reason: "'Dior style of' etc."}
  - {phrase: "-style", scope: title, reason: "Hyphenated suffix: 'Dior-style', 'Rick-style'. The bare word 'style' is allowed."}
  - {phrase: "vibes", scope: title, match: word, reason: "'Rick Owens vibes' = unbranded lookalike."}
  - {phrase: "vibe", scope: title, match: word, reason: "Same."}
  - {phrase: "similar to", scope: any, reason: "Comparison to a brand = not the brand."}
  - {phrase: "like rick", scope: any, reason: "Comparison language ('like rick owens', 'like raf')."}
  - {phrase: "alternative to", scope: any, reason: "Dupe language."}
  - {phrase: "dupe", scope: any, match: word, reason: "Dupe."}
  - {phrase: "lookalike", scope: any, reason: "Lookalike."}
  - {phrase: "look alike", scope: any, reason: "Lookalike."}
  - {phrase: "knockoff", scope: any, reason: "Fake."}
  - {phrase: "knock off", scope: any, reason: "Fake."}
  - {phrase: "knock-off", scope: any, reason: "Fake."}
  - {phrase: "rep", scope: title, match: word, reason: "'Rep' = replica (QualityReps usage). Whole word only."}
  - {phrase: "reps", scope: any, match: word, reason: "Replicas."}
  - {phrase: "1:1", scope: any, reason: "Fake-community quality claim."}
  - {phrase: "1 to 1", scope: any, reason: "Same."}
  - {phrase: "mirror quality", scope: any, reason: "Fake."}
  - {phrase: "high quality copy", scope: any, reason: "Fake."}
  - {phrase: "super copy", scope: any, reason: "Fake."}
  - {phrase: "aaa quality", scope: any, reason: "Fake."}
  - {phrase: "aaa+", scope: any, reason: "Fake."}
  - {phrase: "ua", scope: title, match: word, reason: "'UA' = unauthorized authentic (reps). Whole word; collides with Under Armour 'UA' so only reject when a luxury brand is also detected."}
  - {phrase: "not authentic", scope: any, reason: "Self-declared fake."}
  - {phrase: "not original", scope: any, reason: "Self-declared fake."}
  - {phrase: "unauthentic", scope: any, reason: "Self-declared fake."}
  - {phrase: "unbranded", scope: any, reason: "No brand = not the brand."}
  - {phrase: "no brand", scope: any, reason: "Same."}
  - {phrase: "generic brand", scope: any, reason: "Same."}
  - {phrase: "tribute to", scope: title, reason: "'Tribute to Number Nine' etc. (YSL 'Tribute' sandal is a different phrase: bare 'tribute' is conditional)."}
  - {phrase: "remake", scope: any, reason: "Remade = not original."}
  - {phrase: "recreation", scope: any, reason: "Same."}
  - {phrase: "homage", scope: any, reason: "Lookalike."}
  - {phrase: "fan made", scope: any, reason: "Fan-made."}
  - {phrase: "fanmade", scope: any, reason: "Fan-made."}
  - {phrase: "diy", scope: title, match: word, reason: "Homemade."}
  - {phrase: "hand painted", scope: title, reason: "Usually custom, not authentic (CH/Undercover customs exist but are unverifiable)."}
  - {phrase: "ブランド名なし", scope: any, reason: "JP: 'no brand name'."}
  - {phrase: "ノーブランド", scope: any, reason: "JP: no-brand."}
  - {phrase: "偽物", scope: any, reason: "JP: fake."}
  - {phrase: "コピー品", scope: any, reason: "JP: copy item."}
  # --- added by the scoring engineer from live Mercari JP titles (2026-11-24) ---
  - {phrase: "様専用", scope: title, reason: "JP: listing reserved for a named buyer; not buyable."}
  - {phrase: "専用出品", scope: title, reason: "JP: reserved listing."}
  - {phrase: "専用ページ", scope: title, reason: "JP: reserved listing."}
  - {phrase: "互換", scope: title, reason: "JP: 'compatible with X' (generic part / lookalike)."}
  - {phrase: "等に適合", scope: title, reason: "JP: 'fits X etc.' (generic part)."}
  - {phrase: "オマージュ", scope: any, reason: "JP: homage = lookalike."}
  - {phrase: "コピー品", scope: title, reason: "JP: counterfeit."}
  - {phrase: "海外製", scope: title, reason: "JP: 'overseas-made'; low-weight signal, included for fast reject only when brand is Japan-made-only."}
conditional_phrases:
  - {phrase: "custom", allow_when: ["craft custom", "custom order from the brand", "chrome hearts custom order", "ch custom order", "made to order by the brand", "customized by the brand", "special order", "ch special order"], reason: "'Custom' usually means altered/unofficial. Chrome Hearts genuine special orders exist; require explicit brand-order language."}
  - {phrase: "bootleg", allow_when: ["vintage tee", "90s", "1990s", "2000s", "vintage bootleg", "rap tee", "band tee"], reason: "Vintage rap/band bootleg tees are legit collectibles; modern 'bootleg Supreme' is not."}
  - {phrase: "no tag", allow_when: ["authenticated", "legit check", "legit checked", "receipt", "has care tag", "care tag present", "tag removed for comfort", "wear tag cut"], reason: "Missing brand tag blocks authentication; allow only with evidence."}
  - {phrase: "no tags", allow_when: ["authenticated", "legit check", "receipt", "has care tag"], reason: "Same."}
  - {phrase: "tag cut", allow_when: ["care tag present", "authenticated", "receipt"], reason: "Cut tags hide era/code."}
  - {phrase: "tags removed", allow_when: ["care tag present", "authenticated", "receipt", "size tag present"], reason: "Same."}
  - {phrase: "label removed", allow_when: ["care tag present", "authenticated", "receipt"], reason: "Same (Margiela's removable blank label is the exception: 'four stitches' + 'label removed' is plausible)."}
  - {phrase: "label cut", allow_when: ["care tag present", "authenticated", "receipt"], reason: "Same."}
  - {phrase: "tribute", allow_when: ["ysl tribute", "saint laurent tribute", "tribute sandal", "tribute heel", "yves saint laurent tribute"], reason: "Saint Laurent Tribute sandal is a real product."}
  - {phrase: "replica", allow_when: ["maison margiela replica", "margiela replica", "replica sneaker margiela", "margiela replica gat", "replica by the fireplace"], reason: "Margiela 'Replica' is a real line (sneakers/fragrance)."}
  - {phrase: "レプリカ", allow_when: ["マルジェラ", "メゾンマルジェラ"], reason: "Same, JP."}
  - {phrase: "fake", allow_when: ["original fake", "fake fur", "fake pocket", "fake leather detail", "fake zip", "faux fur", "fake pockets", "no fake"], reason: "'Fake fur'/'fake pockets' are garment features, not counterfeit claims. Also reject 'no fake' as a reassurance, not a flag."}
  - {phrase: "copy", allow_when: ["copy of receipt", "receipt copy", "invoice copy", "copy of invoice", "authenticity card copy", "copy of the receipt"], reason: "Documentation copies are fine; bare 'copy' as an item description is a fake flag."}
  - {phrase: "reworked", allow_when: ["vetements", "margiela", "maison margiela", "junya watanabe", "cdg", "comme des garcons", "by the brand", "brand reworked"], reason: "Brand-made reworked pieces exist (Vetements, Margiela Artisanal, Junya); seller-reworked pieces do not."}
  - {phrase: "handmade", allow_when: ["japan handmade", "hand made in japan", "hand-made in italy", "artisanal", "maison margiela artisanal"], reason: "Brand artisanal pieces exist; generic handmade = custom."}
  - {phrase: "restored", allow_when: ["professionally restored", "cleaned and restored", "leather restored", "conditioned"], reason: "Re-dyed/repainted pieces are fine only if disclosed as cleaning/conditioning; flag otherwise."}
  - {phrase: "re-sewn", allow_when: ["zipper re-sewn", "hem re-sewn", "button re-sewn", "seam re-sewn", "lining re-sewn"], reason: "Label re-sewn is a red flag; other repairs are mild."}
  - {phrase: "refurbished", allow_when: ["leather refurbished", "professionally refurbished"], reason: "Mild."}
  - {phrase: "baby", allow_when: ["dream baby dream", "baby classic", "baby clsc", "baby fat", "baby dagger", "baby tee", "baby blue", "baby pink", "baby milo", "bape baby milo", "baby cashmere", "baby alpaca", "baby doll", "babydoll"], reason: "Kids' items are out of scope; but 'baby tee', 'baby milo' (BAPE), 'baby blue' are valid."}
  - {phrase: "kids", allow_when: ["stray kids", "kidult", "kids tee in men's", "mini hysteric adult"], reason: "Kids' sizes are not men's archive; exceptions rare."}
  - {phrase: "toddler", allow_when: [], reason: "Out of scope."}
  - {phrase: "costume", allow_when: ["costume national", "costume jewelry", "costume jewellery", "vintage costume jewelry chanel"], reason: "Chanel/YSL costume jewelry is a legitimate category; Halloween costume is not."}
  - {phrase: "toy", allow_when: ["toy soldier", "toy boy"], reason: "Mostly out of scope; 'Toy Soldier' is a Moschino/Undercover-adjacent graphic name rarely."}
  - {phrase: "poster", allow_when: ["poster print tee", "poster graphic"], reason: "Posters are category exclusions; 'poster print' on a garment is fine."}
  - {phrase: "sample", allow_when: ["sample piece", "showroom sample", "runway sample", "sample size", "archive sample", "sample sale"], reason: "'Sample' on perfume = reject; on garments = showroom/runway sample = wanted."}
  - {phrase: "vintage wash", allow_when: ["hysteric glamour", "dior homme", "balmain", "rick owens"], reason: "'Vintage wash' on fast-fashion items is generic; only count when a core brand is present."}
