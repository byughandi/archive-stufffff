  - id: yahoo_auctions_jp
    priority: high
    interval_minutes: 60
    method: html
    endpoint: "GET https://auctions.yahoo.co.jp/search/search?p=<keyword>&b=1&n=100&s1=new&o1=d  (URL shape confirmed by a public Huginn config gist; s1=new&o1=d = newest first, n=100 per page, b = 1-based start offset). Category filter: auccat=<id> (memory)."
    auth: "None for public search pages."
    pagination: "b=<start index> (1, 101, 201...) with n=100 (memory for b semantics; verify)."
    sort_newest: "s1=new&o1=d. Also s1=end&o1=a for ending soonest (needed to track auction end times)."
    anti_bot: "Light for low volume: static server-rendered HTML. Aggressive request rates or datacenter IPs may get blocked; GitHub Actions IP ranges untested."
    sold_data: "YES. Closed-auction search at https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=<keyword>&b=1&n=100 (path from memory; several actors scrape 'closedsearch', e.g. datalab-jp, jpmarketdata). Gives final price for ended auctions; unsold ended auctions also appear, check for bid count > 0."
    fields: "Card CSS (from gist): a.Product__titleLink (url, title), .Product__imageData (img), .Product__priceInfo .Product__price (current price; second price = buy-now when present), data-cl-params contains ';st:' start and ';end:' end timestamps. Bid count, seller rating, condition are on cards/detail (class names memory, verify)."
    proxy_deep_links:
      buyee_mercari: "https://buyee.jp/mercari/item/<mercari_item_id> (memory, verify)"
      buyee_yahoo: "https://buyee.jp/item/yahoo/auction/<auction_id> (memory, verify)"
