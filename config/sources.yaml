  - id: mercari_jp
    priority: high
    interval_minutes: 60
    method: library
    endpoint: "POST https://api.mercari.jp/v2/entities:search (memory; mercapi hides it). Use the mercapi library rather than raw calls."
    auth: "No account. mercapi 'implements security mechanisms of the native web app' (README); Apify actors state each request carries a fresh ES256 DPoP JWT. mercapi generates this for you."
    pagination: "pageSize 120 (mercapi source), page_token cursor returned in each response."
    sort_newest: "SortBy.SORT_CREATED_TIME + SortOrder.ORDER_DESC (the pair is on mercapi's allowed list). Source comment warns correct ordering is not guaranteed, so also dedupe by item id and re-check page 2."
    anti_bot: "DPoP + signed request shape; no Cloudflare challenge reported for the API. Breakage risk when Mercari changes signing; library is community-maintained."
    sold_data: "YES: status filter STATUS_SOLD_OUT (mercapi appends STATUS_TRADING automatically). Use for JP sold comps (price in JPY)."
    fields: [id, name, price, status, created, updated, thumbnails, seller_id, item_condition_id, brand, category (search); full_item() adds description, photos, shipping, seller details]
    search_params: {query: "str", categories: "[int]", brands: "[int]", sizes: "[int]", item_conditions: "[int]", colors: "[int]", price_min: int, price_max: int, shipping_methods: "[anonymous|japan_post|no_option]", status: "[on_sale|sold_out]", sort_by: "score|created_time|price|num_likes", sort_order: "desc|asc", exclude: "str"}
    polite_rate: "1 request per 2-3 seconds; hourly watchlist of ~30-60 JP keyword queries."
    libraries:
      - {name: "mercapi (take-kun), MIT, 170 commits, PyPI versions 0.3.0/0.4.0 seen; docs take-kun.github.io/mercapi; exact last-release date not visible this session", url: "https://github.com/take-kun/mercapi"}
      - {name: "mercari (marvinody) on PyPI, v1.0.3 seen; repo URL from memory", url: "https://pypi.org/project/mercari/"}
      - {name: "SteveShin323/carimer-api (unofficial sync+async client, pushed 2026-10-06)", url: "https://github.com/SteveShin323/carimer-api"}
    apify_actors:
