# config/sources.yaml  (R4, 2026-11-24)
# Provenance legend: "reported" = seen in Apify/GitHub/blog text this session (not independently verified);
# "memory" = from model memory, NOT seen this session -> confidence low + verify true.
# Depop and Vinted are intentionally absent.
sources:
  - id: grailed
    priority: core
    interval_minutes: 10
    method: algolia_api
    endpoint: "POST https://<app-id-lowercase>-dsn.algolia.net/1/indexes/*/queries (multi-query). App id: memory says MNRWEFSS2Q (UNVERIFIED, re-discover at runtime from the x-algolia-application-id query param seen in the browser network tab)."
    auth: "Public search-only Algolia key embedded in the Grailed page (window config / JS bundle). Reported by aurenic actor: key is fetched fresh from the homepage on every run; another actor reports the key rotates. So: never hardcode; scrape key + app id from homepage HTML/JS at start of each run, cache for the run only."
    pagination: "Algolia page/hitsPerPage. Actors report 48 hits per page (aurenic/other) while another says up to 1000 hits/page x 500 pages; BlackFalconData actor says max 1,000 listings per search term. Plan for a 1,000-hit cap per query and split queries by designer + price band + category."
    sort_newest: "Use the date-sorted replica index (name reported/remembered as Listing_by_date_production; re-discover). Fallback: query primary index with numericFilters on created_at_i / bumped_at_i and sort client-side."
    anti_bot: "Algolia endpoint itself is not Cloudflare-gated (it is a third-party API). Homepage fetch for the key may meet Cloudflare/bot checks; use a normal browser UA, low rate. Grailed ToS/robots should be reviewed (flagged by multiple sources)."
    sold_data: "YES. Reported by several actors: active listings from index Listing_production and sold from Listing_sold_production (reported by Apify actors, re-discover at runtime, not certain). Hit fields sold_price and sold_at_i; sold_price is null on unsold listings. Grailed also has a 'sold' filter in the web UI."
    fields: [id, title, designers, price, price_drops, size, category_path, condition, cover_photo, created_at, bumped_at, sold, sold_price, sold_at_i, heat, position, strata, seller (user id, username, seller score/reviews)]
    index_names_reported: {live: "Listing_production (reported by Apify actors)", sold: "Listing_sold_production (reported by Apify actor)", date_sorted_replica: "memory only: Listing_by_date_production", heat_replica: "memory only: Listing_by_heat_production"}
    query_params_notes: "hitsPerPage, page, query, facetFilters (e.g. designers.name, category_path, department, strata), numericFilters (price, created_at_i, sold_at_i). Exact attribute names are memory/low: dump one raw hit and one facets response at runtime and cache the schema."
    polite_rate: "1 request/second max; 10-min cadence needs only ~5-20 queries per cycle (watchlist designers x newest page 0). Backoff on 403/429."
    libraries:
      - {name: "wavehs/grailed-scraper (pushed 2026-11-02, 1 star, README has no mechanics, treat as unvetted)", url: "https://github.com/wavehs/grailed-scraper"}
      - {name: "BlackFalconData-org/grailed-com-scraper (Apify actor source, pushed 2026-10-19)", url: "https://github.com/BlackFalconData-org/grailed-com-scraper"}
    apify_actors:
      - {id: "123webdata/grailed-scraper", price_per_1k_usd: 0.9}
      - {id: "aurenic/grailed-scraper", price_per_1k_usd: 1.2}
      - {id: "bovi/grailed-listings", price_per_1k_usd: 1.5}
      - {id: "unfenced-group/grailed-scraper (has sold-archive mode)", price_per_1k_usd: 1.49}
      - {id: "weltverbenzer/grailed-sold-listings-scraper", price_per_1k_usd: UNKNOWN}
    recommendation: direct
    live_test: {status: not_tested, detail: "build container firewall blocks marketplace hosts; Orchestrator runs live tests after allowlist approval", date: "2026-11-24"}
    sources: ["https://apify.com/aurenic/grailed-scraper", "https://apify.com/bovi/grailed-listings", "https://apify.com/unfenced-group/grailed-scraper", "https://github.com/BlackFalconData-org/grailed-com-scraper", "https://www.scrapingbee.com/blog/how-to-scrape-algolia-search/"]
    confidence: med
    verify: true

  - id: mercari_us
    priority: core
    interval_minutes: 20
    method: graphql
    endpoint: "POST https://www.mercari.com/v1/api (GraphQL; memory). Search operation name reported by an Apify actor as searchFacetQuery (singular); not confirmed. Some actors describe persisted queries (sha256 hash in extensions) - re-capture hash from the browser network tab."
    auth: "Anonymous guest token minted automatically by the web app (reported by Apify actor); requests are DPoP-signed with an ES256 (P-256) JWT proof generated client-side (reported by several actors; RFC 9449). Mechanism details not documented in any source seen; capture from a headless-browser session."
    pagination: "Cursor/offset in GraphQL variables (memory, unverified)."
    sort_newest: "GraphQL sortBy enum (memory: SORT_CREATED_TIME / sort by newest); verify by capturing a UI request after choosing 'Newest'."
    anti_bot: "Cloudflare + session checks. Reported: plain HTTP clients get 403 instead of HTML. Hardest source (per taste profile). Likely needs a real browser (Playwright) to obtain cookies/token, or a managed actor."
    sold_data: "YES via status filter 'sold' in search (reported by getascraper and devilscrapes actors). Gives sold price; sold date reliability unverified."
    fields: [id, name, price, status, condition, brand, size, photos, seller, createdAt, updatedAt, likes]
