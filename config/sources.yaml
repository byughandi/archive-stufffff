    recommendation: library
    live_test: {status: not_tested, detail: "build container firewall blocks marketplace hosts; Orchestrator runs live tests after allowlist approval", date: "2026-11-24"}
    sources: ["https://github.com/take-kun/mercapi", "https://raw.githubusercontent.com/take-kun/mercapi/main/mercapi/requests/search.py", "https://pypi.org/project/mercapi/0.4.0", "https://apify.com/logiover/mercari-japan-scraper"]
